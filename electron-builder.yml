appId: app.aurelium.desktop
productName: Aurelium
copyright: Copyright © 2026 Henrique

directories:
  output: dist
  buildResources: build

files:
  - out/**
  - assets/aurelium_logo.png
  - package.json
  - '!node_modules/node-pty/{src,deps,third_party,scripts,typings,binding.gyp}'
  - '!node_modules/node-pty/build/{deps,Release/obj,Release/.deps}'
  - '!node_modules/node-pty/**/*.{pdb,map,md,ts}'
  - '!node_modules/node-pty/prebuilds/{darwin-arm64,darwin-x64,win32-arm64}'
  - '!node_modules/@xterm/**/*.{map,md}'

# node-pty is a native module: its binaries and helper executables cannot run from inside the
# archive.
asarUnpack:
  - node_modules/node-pty/**

# agentctl is copied to its fixed per-user folder when the app starts (see agentctlInstall.ts).
extraResources:
  - from: resources/agentctl
    to: agentctl

# node-pty 1.1 is an N-API addon: the binary shipped in the package (Windows) or compiled by
# `npm ci` (Linux) already works in Electron, so nothing is rebuilt here. See ADR 0010.
npmRebuild: false

win:
  executableName: Aurelium
  target:
    - target: nsis
      arch: [x64]
  icon: assets/aurelium_logo.png

nsis:
  oneClick: true
  perMachine: false
  artifactName: Aurelium-${version}-setup.${ext}

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  # One file per standard size, made from assets/aurelium_logo.png. Given the logo alone, the
  # package installed it as hicolor/1254x1254, a size the icon theme does not have: the menu
  # and the dock found no icon.
  icon: build/icons
  category: Development
  executableName: aurelium
  # The window is tied to the entry of the menu through desktopName (package.json): without it
  # the dock showed a window with no icon, apart from the launcher.
  syncDesktopName: true
  maintainer: Henrique <HenriqueAurelio@users.noreply.github.com>
  synopsis: Sessões de Claude Code e Codex em uma janela só
  artifactName: Aurelium-${version}.${ext}

# The default list of electron-builder, plus two libraries Electron does not start without and
# that a system with no desktop may lack: libgbm.so.1 (graphics) and libasound.so.2 (sound).
# Ubuntu 24.04 and
# Debian 13 renamed the package to libasound2t64, and there `libasound2` is only a name that
# liboss4-salsa-asound2 also offers: apt may pick it, and Electron fails on the symbols it lacks.
# So the new name comes first, and the old one serves Debian 12 and Ubuntu 22.04. Setting
# `depends` replaces the default list, so it is repeated here.
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libgbm1
    - libasound2t64 | libasound2

# Out of the v1: auto-update and code signing.
publish: null
